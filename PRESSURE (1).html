<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRESSURE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --black: #000000;
    --white: #ffffff;
    --gray: #8f8f8f;
    --glass: rgba(0,0,0,0.5);
    --hair: rgba(255,255,255,0.16);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{
    scroll-behavior: smooth;
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  body{
    background: var(--black);
    color: var(--white);
    font-family: 'Space Grotesk', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  ::selection{ background: var(--white); color: var(--black); }

  /* ---------- NAV ---------- */
  nav{
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: calc(22px + env(safe-area-inset-top, 0px)) clamp(20px, 4vw, 48px) 22px;
    pointer-events: none;
  }
  nav span{
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 0.14em;
    color: var(--white);
    pointer-events: auto;
  }
  nav .menu{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.22em;
    cursor: pointer;
    padding: 6px 2px;
    border-bottom: 1px solid transparent;
    transition: border-color 0.25s ease;
  }
  nav .menu:hover{ border-color: var(--white); }

  /* ---------- HERO ---------- */
  .hero{
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--black);
  }
  .hero-frame{
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .hero-frame img{
    position: absolute;
    top: 50%; left: 50%;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 32%;
    filter: contrast(1.03);
    transform: translate(-50%,-50%) scale(1.06);
    transition: transform 0.4s ease-out;
    will-change: transform;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background: rgba(0,0,0,0.32);
    z-index: 1;
  }
  .hero::after{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%);
    z-index: 1;
  }

  .hero-content{
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 20px;
  }
  .brand{
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px, 12vw, 132px);
    letter-spacing: 0.06em;
    line-height: 1;
  }
  .tagline{
    margin-top: 14px;
    font-size: clamp(11px, 1.6vw, 14px);
    font-weight: 400;
    letter-spacing: 0.14em;
    color: rgba(255,255,255,0.82);
    max-width: 30ch;
  }

  /* ---------- COUNTDOWN GLASS PANEL ---------- */
  .countdown{
    margin-top: clamp(28px, 5vw, 46px);
    display: flex;
    gap: clamp(14px, 3vw, 30px);
    background: var(--glass);
    backdrop-filter: blur(10px) saturate(1.1);
    -webkit-backdrop-filter: blur(10px) saturate(1.1);
    border: 1px solid var(--hair);
    border-radius: 2px;
    padding: clamp(14px, 2.6vw, 22px) clamp(18px, 4vw, 34px);
  }
  .unit{
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 44px;
  }
  .unit .n{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: clamp(20px, 3.4vw, 30px);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }
  .unit .l{
    margin-top: 6px;
    font-size: 9px;
    letter-spacing: 0.18em;
    color: var(--gray);
  }
  .sep{
    color: var(--hair);
    font-weight: 300;
    font-size: clamp(16px, 2.6vw, 22px);
    align-self: center;
    padding-bottom: 14px;
  }

  .scroll-cue{
    position: absolute;
    bottom: clamp(18px, 4vh, 30px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    width: 1px;
    height: 34px;
    background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.7) 100%);
  }

  /* ---------- BELOW FOLD ---------- */
  .below{
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 90px 24px calc(70px + env(safe-area-inset-bottom, 0px));
  }
  .below h2{
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(30px, 6vw, 52px);
    letter-spacing: 0.05em;
  }
  .below p.sub{
    margin-top: 10px;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--gray);
  }

  form.waitlist{
    margin-top: 40px;
    display: flex;
    width: 100%;
    max-width: 420px;
    border-bottom: 1px solid var(--hair);
    padding-bottom: 14px;
  }
  form.waitlist input{
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--white);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    letter-spacing: 0.04em;
    padding: 8px 6px;
  }
  form.waitlist input::placeholder{ color: rgba(255,255,255,0.4); }

  .notify-btn{
    background: transparent;
    border: 1px solid var(--white);
    color: var(--white);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    padding: 10px 20px;
    margin-top: 26px;
    cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease;
  }
  .notify-btn:hover{ background: var(--white); color: var(--black); }

  .status-msg{
    margin-top: 18px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--gray);
    min-height: 14px;
  }

  footer{
    text-align: center;
    padding: 28px 24px calc(28px + env(safe-area-inset-bottom, 0px));
    font-size: 10px;
    letter-spacing: 0.16em;
    color: rgba(255,255,255,0.35);
  }

  /* ---------- REVEAL ---------- */
  [data-reveal]{
    opacity: 0;
    transform: translateY(14px);
  }
  @media (prefers-reduced-motion: no-preference){
    [data-reveal].in{
      animation: rise 0.9s cubic-bezier(.2,.7,.2,1) forwards;
    }
    @keyframes rise{
      to{ opacity: 1; transform: translateY(0); }
    }
  }
  @media (prefers-reduced-motion: reduce){
    [data-reveal]{ opacity: 1; transform: none; }
  }

  @media (max-width: 480px){
    .countdown{ gap: 10px; padding: 14px 14px; }
    .sep{ padding-bottom: 10px; }
    .unit{ min-width: 34px; }
  }
</style>
</head>

  <span>PRESSURE</span>
  <span class="menu">MENU</span>
</nav>

  <div class="hero-content">
    <h1 class="brand" data-reveal>PRESSURE</h1>
    <p class="tagline" data-reveal>&ldquo;BUILT FOR THOSE WHO REFUSE TO BE AVERAGE.&rdquo;</p>

    <div class="countdown" data-reveal aria-live="polite">
      <div class="unit"><span class="n" id="cd-m">00</span><span class="l">MONTHS</span></div>
      <span class="sep">/</span>
      <div class="unit"><span class="n" id="cd-d">00</span><span class="l">DAYS</span></div>
      <span class="sep">/</span>
      <div class="unit"><span class="n" id="cd-h">00</span><span class="l">HRS</span></div>
      <span class="sep">/</span>
      <div class="unit"><span class="n" id="cd-min">00</span><span class="l">MIN</span></div>
      <span class="sep">/</span>
      <div class="unit"><span class="n" id="cd-s">00</span><span class="l">SEC</span></div>
    </div>
  </div>

  <div class="scroll-cue"></div>
</section>

<section class="below">
  <h2 data-reveal>COMING SOON</h2>
  <p class="sub" data-reveal>JOIN THE WAITLIST</p>

  <form class="waitlist" id="waitlistForm" data-reveal>
    <input type="email" id="emailInput" placeholder="YOUR EMAIL ADDRESS" required>
  </form>
  <button type="submit" form="waitlistForm" class="notify-btn" data-reveal>NOTIFY ME</button>
  <p class="status-msg" id="statusMsg"></p>
</section>

<footer>© PRESSURE — ALL RIGHTS RESERVED</footer>

<script>
  // ---- reveal on load ----
  document.querySelectorAll('[data-reveal]').forEach(function(el, i){
    setTimeout(function(){ el.classList.add('in'); }, 80 + i * 90);
  });

  // ---- subtle parallax on mouse move (fine pointers only) ----
  if(window.matchMedia('(pointer: fine)').matches && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    var img = document.getElementById('heroImg');
    var frame = document.getElementById('heroFrame');
    frame.addEventListener('mousemove', function(e){
      var rect = frame.getBoundingClientRect();
      var x = (e.clientX - rect.left) / rect.width - 0.5;
      var y = (e.clientY - rect.top) / rect.height - 0.5;
      img.style.transform = 'translate(-50%,-50%) scale(1.06) translate(' + (x * -14) + 'px,' + (y * -10) + 'px)';
    });
    frame.addEventListener('mouseleave', function(){
      img.style.transform = 'translate(-50%,-50%) scale(1.06) translate(0,0)';
    });
  }

  // ---- countdown: 9 months from now ----
  var target = new Date();
  target.setMonth(target.getMonth() + 9);

  function timeRemaining(target){
    var now = new Date();
    var months = (target.getFullYear() - now.getFullYear()) * 12 + (target.getMonth() - now.getMonth());
    var marker = new Date(now);
    marker.setMonth(marker.getMonth() + months);
    if(marker > target){
      months--;
      marker.setMonth(marker.getMonth() - 1);
    }
    var diff = target - marker;
    if(diff < 0) diff = 0;
    var days = Math.floor(diff / 86400000);
    var hours = Math.floor((diff % 86400000) / 3600000);
    var mins = Math.floor((diff % 3600000) / 60000);
    var secs = Math.floor((diff % 60000) / 1000);
    return { months: Math.max(months,0), days: days, hours: hours, mins: mins, secs: secs };
  }

  function pad(n){ return String(n).padStart(2,'0'); }

  function tick(){
    var t = timeRemaining(target);
    document.getElementById('cd-m').textContent = pad(t.months);
    document.getElementById('cd-d').textContent = pad(t.days);
    document.getElementById('cd-h').textContent = pad(t.hours);
    document.getElementById('cd-min').textContent = pad(t.mins);
    document.getElementById('cd-s').textContent = pad(t.secs);
  }
  tick();
  setInterval(tick, 1000);

  // ---- waitlist form (front-end only confirmation) ----
  document.getElementById('waitlistForm').addEventListener('submit', function(e){
    e.preventDefault();
    var email = document.getElementById('emailInput').value.trim();
    var status = document.getElementById('statusMsg');
    if(!email){ return; }
    status.textContent = "YOU'RE ON THE LIST.";
    document.getElementById('emailInput').value = '';
  });
</script>
